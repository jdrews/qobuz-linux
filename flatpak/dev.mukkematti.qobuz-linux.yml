app-id: dev.mukkematti.qobuz-linux
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: qobuz-linux
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.mpris.MediaPlayer2.*
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  - --talk-name=org.kde.StatusNotifierWatcher
build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    NPM_CONFIG_LOGLEVEL: info
  arch:
    x86_64:
      env:
        ELECTRON_BUILDER_ARCH: x64
    aarch64:
      env:
        ELECTRON_BUILDER_ARCH: arm64
modules:
  - name: qobuz-linux
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/qobuz-linux/flatpak-node/cache
        npm_config_cache: /run/build/qobuz-linux/flatpak-node/npm-cache
        npm_config_offline: 'true'
        npm_config_progress: 'false'
        npm_config_loglevel: 'error'
        npm_config_audit: 'false'
        npm_config_fund: 'false'
        electron_config_cache: /run/build/qobuz-linux/flatpak-node/cache/electron
        ELECTRON_CACHE: /run/build/qobuz-linux/flatpak-node/cache/electron
        DEBUG: '@electron/get:*'

    build-commands:
      - |
        # Set architecture args based on platform (Electron 43 / Chromium 150)
        case "$(uname -m)" in
          x86_64) export ELECTRON_BUILDER_ARCH_ARGS="--x64" ;;
          aarch64|armv7l) export ELECTRON_BUILDER_ARCH_ARGS="--arm" ;;
          *) export ELECTRON_BUILDER_ARCH_ARGS="--x64" ;;
        esac
        npm install --offline --no-audit --no-fund --ignore-scripts 2>&1 | tee npm-install.log
        echo "Running electron-builder..."
        ./node_modules/.bin/electron-builder \
          -c ./build/electron-builder.base.yml \
          $ELECTRON_BUILDER_ARCH_ARGS \
          --linux \
          --dir \
          --config.compression=store 2>&1 | tee electron-builder.log
      - echo "Checking build output..." && ls -la dist/linux*unpacked/ || { echo "ERROR: No build output!"; exit 1; }
      - cp -a dist/linux*unpacked/* ${FLATPAK_DEST}/
      - mkdir -p ${FLATPAK_DEST}/bin
      - |
        cat <<'EOF' > ${FLATPAK_DEST}/bin/qobuz-linux
        #!/bin/bash
        
        EXTRA_ARGS=""
        
        if [[ -e "${XDG_RUNTIME_DIR}/wayland-0" || -e "/wayland-0" ]]; then
            echo "Debug: Enabling Wayland backend"
            EXTRA_ARGS="--ozone-platform-hint=auto --enable-features=WaylandWindowDecorations --enable-wayland-ime --wayland-text-input-version=3"
        fi
        
        exec /app/qobuz-linux --no-sandbox $EXTRA_ARGS "$@"
        EOF
        chmod +x ${FLATPAK_DEST}/bin/qobuz-linux
      - mkdir -p ${FLATPAK_DEST}/share/metainfo
      - appstreamcli news-to-metainfo --format=markdown NEWS build/dist/flatpak/share/metainfo/${FLATPAK_ID}.metainfo.xml.in ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - appstreamcli validate --no-net --strict ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 build/icons/512x512.png                                     ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 build/dist/flatpak/share/applications/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop

    subdir: main
    sources:
      - type: dir
        path: ..
        dest: main
      - generated-sources.json
